---
name: Publish to PyPI

on:
    release:
        types: [published]

jobs:
    publish:
        name: Publish to PyPI
        runs-on: ubuntu-latest

        permissions:
            id-token: write

        steps:
            - uses: actions/checkout@v6
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install uv
              uses: astral-sh/setup-uv@v8.1.0
            - name: Build
              run: uv build
            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
