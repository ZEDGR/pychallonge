[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["challonge"]

[project]
name = "pychallonge"
version = "3.0.0"
description = "Lightweight Python wrapper for the Challonge API"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "ZEDGR", email = "georlema@gmail.com"},
]
keywords = ["challonge", "tournaments", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.28.1",
    "iso8601>=2.1.0",
    "tzlocal>=5.3.1",
]

[project.urls]
Homepage = "https://github.com/ZEDGR/pychallonge"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"  # match your project's Python version
line-length = 88

[tool.ruff.lint]
select = [
    "F",     # Pyflakes — unused imports, undefined names, etc.
    # "E",     # pycodestyle errors
    # "W",     # pycodestyle warnings
    "I",     # isort — import sorting
    # "N",     # pep8-naming — naming conventions
    "UP",    # pyupgrade — suggests modern Python syntax
    "B",     # flake8-bugbear — common gotchas and design problems
    # "SIM",   # flake8-simplify — simplifiable code patterns
    "RUF",   # Ruff-specific rules
]
ignore = []


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
